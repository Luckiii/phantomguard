[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantomguard-cli"
version = "0.1.0"
description = "Catches AI-hallucinated (slopsquatted) package names before install."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Muhammad Luqman" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/Luckiii/phantomguard"
Repository = "https://github.com/Luckiii/phantomguard"
Issues = "https://github.com/Luckiii/phantomguard/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
fuzz = [
    "anthropic>=0.40",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
phantomguard = "phantomguard.cli:app"
phantomguard-mcp = "phantomguard.integrations.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["phantomguard"]
