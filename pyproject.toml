[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantomguard"
version = "0.1.0"
description = "Catches AI-hallucinated (slopsquatted) package names before install."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
fuzz = [
    "anthropic>=0.40",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
phantomguard = "phantomguard.cli:app"
phantomguard-mcp = "phantomguard.integrations.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["phantomguard"]
